<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>Crop Sathi — AI Crop Recommendation for Farmers</title>
  <meta name="description" content="AI powered crop recommendation, weather, mandi prices and government schemes for Indian farmers.">
  <meta name="author" content="Crop Sathi">
  <meta property="og:title" content="Crop Sathi — AI Crop Recommendation for Farmers">
  <meta property="og:description" content="Smarter farming decisions using artificial intelligence.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">

  <!-- Favicon removed -->

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#294936">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- SPA mount point -->
  <div id="app"></div>

  <!-- Scripts -->
  <script src="js/icons.js"></script>
  <script src="js/db.js"></script>
  <script src="js/cropData.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
